services:
  postgres:
    image: postgres:17-alpine
    container_name: sprintly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sprintly
      POSTGRES_PASSWORD: sprintly
      POSTGRES_DB: sprintly
    ports:
      - "5432:5432"
    volumes:
      - sprintly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprintly -d sprintly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sprintly-pgdata:
